# GPU environment for Stage 3b — scGPT fine-tuning.
#
# Isolated from perturb-bench (environment.yml) because scGPT's pyproject.toml
# pins `cell-gears<0.0.3`, which conflicts with the GEARS stage's own
# `cell-gears` (0.1.2) — the two cannot be resolved into one environment.
# Per BUILD_PLAN.md §5, this stage also needs a CUDA-matched torch/flash-attn
# build, a second, independent reason to keep it separate from the CPU-only
# base env.
#
# Verified directly against bowang-lab/scGPT's pyproject.toml (main branch) —
# do not trust the README's older `pip install scgpt "flash-attn<1.0.5"`
# instructions, which are stale relative to pyproject.toml's declared `[fa2]`
# extra (flash-attn>=2.8.0, torch>=2.2.0).
#
# Target GPU for src/stage3_models/train_scgpt.py is Ampere+ (tested against
# an RTX 3090 24GB and an RTX 3060 12GB, both compute capability 8.6) --
# flash-attn>=2.8.0 fully supports Ampere (unlike a Pascal/Turing card, where
# it wouldn't install/run at all). If your GPU is older than Turing (compute
# capability < 7.5), skip the flash-attn install step in
# scripts/run_scgpt_gpu.sh entirely and set use_fast_transformer: false in
# configs/training_hyperparameters.yaml's stage3b_scgpt section -- scGPT
# falls back to a slower vanilla-attention path.
#
# flash-attn is intentionally NOT in the pip list below -- confirmed by a
# real failure: flash-attn's setup.py does `import torch` at build time to
# detect the CUDA version, but pip's build isolation (on by default) builds
# each package in a throwaway venv that can't see this env's already-
# installed torch, so that import fails ("ModuleNotFoundError: No module
# named 'torch'") no matter how early torch appears in this same dependency
# list. Fix is `pip install flash-attn --no-build-isolation` run as a
# separate step *after* the env (with torch) already exists --
# scripts/run_scgpt_gpu.sh does this automatically.
name: perturb-bench-scgpt
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # Pinned to 2.3.* (not a loose 2.*) -- confirmed by a real failure: scgpt
  # pulls in torchtext (for torchtext.vocab.Vocab, used by train_scgpt.py's
  # gene vocabulary, per scGPT's own Tutorial_Perturbation.ipynb), and
  # PyPI's last torchtext release (0.18.0, since torchtext itself was
  # discontinued by the PyTorch team in 2024) is a native extension built
  # against torch 2.3's C++ ABI specifically. pip's resolver only checks
  # scgpt's loose `torch>=1.13.0` version specifier, not binary ABI
  # compatibility, so a newer torch (e.g. 2.5.1) installs "successfully"
  # but torchtext's compiled .so then fails at import time with
  # `OSError: ... undefined symbol: _ZN5torch3jit17parseSchemaOrNameERKSs`.
  - pytorch=2.3.*
  # Match pytorch-cuda to the actual GPU's driver if it differs; 12.1 is
  # broadly compatible with Ampere (RTX 30-series) and newer.
  - pytorch-cuda=12.1
  - pyyaml
  # Speeds up (and makes more reliable) flash-attn's from-source compile,
  # which scripts/run_scgpt_gpu.sh triggers after this env is created.
  - ninja
  - pip:
      # Pulls in scGPT's own pinned stack, including cell-gears<0.0.3 — this
      # is expected and fine, it's isolated in this env and unrelated to the
      # GEARS stage's cell-gears 0.1.2 in perturb-bench.
      #
      # Installed from a pinned GitHub commit, NOT PyPI's scgpt==0.2.4 --
      # confirmed by a real failure: PyPI's release still imports the old
      # flash-attn 1.x-only `flash_attn.flash_attention.FlashMHA` API, and
      # (more importantly) doesn't have `scgpt.utils.load_pretrained`, which
      # train_scgpt.py needs to correctly map the pretrained checkpoint's
      # fused-QKV parameter names onto whatever attention module actually
      # gets built. This commit is bowang-lab's own fix for exactly this
      # (PR #351, "cuda-12.8 and FlashAttention 2.x compatibility", merged
      # 2026-04-27, unreleased to PyPI as of this writing) -- see CLAUDE.md's
      # scGPT section for the full story. Pinned to an exact commit (not a
      # floating `main`) for reproducibility, per this project's own
      # every-hyperparameter-and-dependency-is-pinned convention.
      - scgpt @ git+https://github.com/bowang-lab/scGPT.git@cebd6fae655b9c585a4807daa3ac31bb764f06b4
      - einops>=0.6.0
      # scgpt's own utils/util.py does `from IPython import get_ipython` at
      # import time, but scgpt's pyproject.toml doesn't declare IPython as a
      # dependency -- confirmed by a real failure (ModuleNotFoundError on a
      # fresh env with everything else above installed).
      - ipython
      # train_scgpt.py's data loading reuses GEARS's PertData dataloaders
      # (per scGPT's own Tutorial_Perturbation.ipynb), which are built with
      # torch_geometric's DataLoader — confirmed by a real failure that
      # scgpt's pinned cell-gears<0.0.3 does NOT pull this in transitively,
      # so it must be listed explicitly here.
      - torch_geometric
      # Downloads the pretrained scGPT checkpoint from its Google Drive
      # folder (see scripts/download_scgpt_checkpoint.py) — scGPT's weights
      # aren't distributed any other way as of this writing.
      - gdown
      # Optional training-run logging/visualization (scGPT's own README
      # recommendation, not a hard requirement):
      # - wandb
