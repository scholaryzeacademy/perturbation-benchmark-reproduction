name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset to smoke-test the download for"
        type: choice
        options: [adamson, norman]
        default: adamson

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests/ -m "not integration" -v

  # Confirms GEARS's dataset download path is still live -- the first thing
  # BUILD_PLAN.md Sec.4 flags as needing continuous verification ("a broken
  # data-download step blocks everything downstream"). Only Adamson
  # (single-gene, smaller) runs on every push/PR to keep CI fast and
  # free-tier-compatible (BUILD_PLAN.md Sec.5); Norman can be checked via
  # workflow_dispatch on demand. Baseline/GEARS-training smoke-testing
  # (Stage 2/3a) gets added here once those stages exist.
  data-smoke-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Cache downloaded Perturb-seq data
        uses: actions/cache@v4
        with:
          path: data
          key: pertdata-${{ github.event.inputs.dataset || 'adamson' }}-v1
      - run: python -m src.stage1_data.cli --dataset ${{ github.event.inputs.dataset || 'adamson' }}
