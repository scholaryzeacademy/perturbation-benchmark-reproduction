# Every hyperparameter and random seed used by the pipeline lives here,
# organized by stage -- see BUILD_PLAN.md Sec.9 point 5 ("document every
# hyperparameter and random seed... or it undermines the exact credibility
# this project is meant to build"). Sections for later stages get added here
# as those stages are implemented.

stage1_data:
  datasets: [norman, adamson]
  data_dir: ./data
  # GEARS's own documented split -- used as-is rather than re-splitting, to
  # preserve comparability with published numbers (BUILD_PLAN.md Sec.4/Sec.6).
  split: simulation
  seed: 1
  train_gene_set_size: 0.75
  batch_size: 32
  test_batch_size: 128

stage2_baselines:
  ridge:
    alpha: 1.0
    seed: 1

stage3a_gears:
  # GEARS's own documented library defaults (BUILD_PLAN.md Sec.6 Stage 3a:
  # "train GEARS using its own documented training procedure and default
  # hyperparameters" -- not tuned by this project). Verified directly against
  # gears/gears.py's model_initialize()/train() signatures.
  hidden_size: 64
  epochs: 20
  lr: 0.001
  weight_decay: 0.0005
  weight_bias_track: false
  # Used ONLY by the CI/integration smoke test (BUILD_PLAN.md Sec.5: GEARS is
  # smoke-tested in CI "on a small perturbation subset", unlike the
  # foundation-model stages) -- confirms the training loop runs end-to-end,
  # not meant to produce a usable trained model. Real results use the values
  # above.
  smoke_test:
    hidden_size: 8
    epochs: 1

stage3b_scgpt:
  # Verified directly against bowang-lab/scGPT's own
  # tutorials/Tutorial_Perturbation.ipynb (main branch) -- scGPT's documented
  # perturbation-prediction fine-tuning example, per BUILD_PLAN.md Sec.6
  # Stage 3b ("follow scGPT's documented perturbation-prediction fine-tuning
  # example"). Not tuned by this project, same convention as stage3a_gears.
  #
  # embsize/d_hid/nlayers/nhead/n_layers_cls are the tutorial's fallback
  # architecture if no pretrained checkpoint is loaded -- with
  # pretrained_model set (the normal case), the checkpoint's own args.json
  # overrides all five at load time, so what's below only matters if you
  # deliberately train from scratch.
  pretrained_model: whole-human  # bowang-lab/scGPT's recommended checkpoint (33M human cells)
  lr: 0.0001
  batch_size: 64
  eval_batch_size: 64
  epochs: 15
  schedule_interval: 1
  early_stop: 10
  embsize: 512
  d_hid: 512
  nlayers: 12
  nhead: 8
  n_layers_cls: 3
  dropout: 0
  use_fast_transformer: true  # needs flash-attn; see environment-scgpt.yml
  amp: true
  include_zero_gene: all
  max_seq_len: 1536
  load_param_prefixs: [encoder, value_encoder, transformer_encoder]
  seed: 42
